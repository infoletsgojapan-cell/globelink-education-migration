<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1A2B4C" />
      <stop offset="60%" stop-color="#0E192E" />
      <stop offset="100%" stop-color="#070D18" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E5BE53" />
      <stop offset="50%" stop-color="#C59328" />
      <stop offset="75%" stop-color="#FDE895" />
      <stop offset="100%" stop-color="#996D12" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="50%" stop-color="#E2B747" />
      <stop offset="100%" stop-color="#A27318" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B540A" />
      <stop offset="50%" stop-color="#BF8E27" />
      <stop offset="100%" stop-color="#E8C365" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Navy Base Badge -->
  <rect width="120" height="120" rx="24" fill="url(#bgGlow)" />
  <rect width="116" height="116" x="2" y="2" rx="22" fill="none" stroke="url(#goldSheen)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Outer Wreath / Beaded Ring Frame -->
  <circle cx="60" cy="58" r="44" fill="none" stroke="url(#goldSheen)" stroke-width="3" filter="url(#goldShadow)" />
  <circle cx="60" cy="58" r="40.5" fill="none" stroke="url(#goldDark)" stroke-width="1" stroke-dasharray="2,3" stroke-linecap="round" />

  <!-- Laurel leaf embellishments around circle perimeter -->
  <g fill="url(#goldSheen)" opacity="0.85">
    <path d="M 22 58 C 22 55 18 52 17 55 C 16 58 19 60 22 58 Z" />
    <path d="M 98 58 C 98 55 102 52 103 55 C 104 58 101 60 98 58 Z" />
    <path d="M 25 43 C 26 40 22 38 21 41 C 20 44 23 45 25 43 Z" />
    <path d="M 95 43 C 94 40 98 38 99 41 C 100 44 97 45 95 43 Z" />
    <path d="M 33 30 C 35 28 31 25 29 27 C 28 30 31 32 33 30 Z" />
    <path d="M 87 30 C 85 28 89 25 91 27 C 92 30 89 32 87 30 Z" />
    <path d="M 25 73 C 26 76 22 78 21 75 C 20 72 23 71 25 73 Z" />
    <path d="M 95 73 C 94 76 98 78 99 75 C 100 72 97 71 95 73 Z" />
  </g>

  <!-- Central Crest Content with 3D Gold Shadow -->
  <g filter="url(#goldShadow)">
    
    <!-- GRADUATION CAP (MORTARBOARD) -->
    <!-- Cap Diamond/Top in Perspective -->
    <polygon points="60,26 84,36 60,43 36,36" fill="url(#goldLight)" />
    <!-- Cap Diamond Bevels for 3D metallic feel -->
    <polygon points="60,26 84,36 60,37" fill="url(#goldSheen)" opacity="0.9" />
    <polygon points="36,36 60,43 60,37" fill="url(#goldDark)" />
    <!-- Cap Skullcap/Base Underneath -->
    <path d="M 46 39.5 L 46 44 C 46 48 74 48 74 44 L 74 39.5 C 70 42 50 42 46 39.5 Z" fill="url(#goldDark)" />

    <!-- Cap Button & Dangling Tassel -->
    <circle cx="60" cy="35" r="2" fill="#FFF8D6" />
    <!-- Tassel Cord & Fringe on Right -->
    <path d="M 60 35 Q 73 38 78 47 L 78 54 Q 80 54 81 50 L 79 46 Q 73 37 60 35 Z" fill="url(#goldSheen)" />
    <rect x="76.5" y="52" width="4" height="6" rx="1.5" fill="url(#goldLight)" />

    <!-- GLOBAL LINK DYNAMIC ARCH (Bridging Education to Migration) -->
    <path d="M 33 67 C 36 49 53 43 60 45 C 67 43 84 49 87 67 C 82 56 68 50 60 51 C 52 50 38 56 33 67 Z" fill="url(#goldSheen)" />

    <!-- OPEN BOOK (Pages & Spine) -->
    <!-- Left Page -->
    <path d="M 60 69 C 53 66 43 66 38 68 C 38 74 38 80 38 84 C 44 82 53 82 60 85 Z" fill="url(#goldLight)" />
    <!-- Left Page Shading / Under-ribbon -->
    <path d="M 38 84 C 44 82 53 82 60 85 L 60 87 C 53 84 44 84 38 86 Z" fill="url(#goldDark)" />
    <!-- Left Page Text/Ribbon lines -->
    <line x1="43" y1="71.5" x2="56" y2="70" stroke="#7A5208" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <line x1="43" y1="74.5" x2="56" y2="73" stroke="#7A5208" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <line x1="43" y1="77.5" x2="54" y2="76" stroke="#7A5208" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page -->
    <path d="M 60 69 C 67 66 77 66 82 68 C 82 74 82 80 82 84 C 76 82 67 82 60 85 Z" fill="url(#goldSheen)" />
    <!-- Right Page Shading / Under-ribbon -->
    <path d="M 82 84 C 76 82 67 82 60 85 L 60 87 C 67 84 76 84 82 86 Z" fill="url(#goldDark)" />
    <!-- Right Page Text/Ribbon lines -->
    <line x1="64" y1="70" x2="77" y2="71.5" stroke="#7A5208" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <line x1="64" y1="73" x2="77" y2="74.5" stroke="#7A5208" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
    <line x1="64" y1="76" x2="75" y2="77.5" stroke="#7A5208" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

    <!-- Center Spine & Bookmark Ribbon -->
    <polygon points="59,68 61,68 61,89 60,91 59,89" fill="url(#goldDark)" />
  </g>

  <!-- Star Accent At Base -->
  <polygon points="60,96 61.5,99.5 65,100 62.5,102.5 63,106 60,104 57,106 57.5,102.5 55,100 58.5,99.5" fill="url(#goldLight)" filter="url(#goldShadow)" />
</svg>
